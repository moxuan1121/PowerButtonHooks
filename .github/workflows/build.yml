name: Build RootHide deb

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify source contract
        run: python3 -m unittest discover -s tests -v

      - name: Install RootHide Theos and SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew install ldid
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          export THEOS="$RUNNER_TEMP/theos"
          "$THEOS/bin/install-sdk" iPhoneOS16.5

      - name: Build package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          ! grep -F "incompatible arm64e ABI compiler" build.log

      - uses: actions/upload-artifact@v4
        with:
          name: PowerButton-roothide
          path: packages/*.deb
          if-no-files-found: error

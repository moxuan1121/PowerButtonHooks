name: Build RootHide deb

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify source contract
        run: python3 -m unittest discover -s tests -v

      - name: Install RootHide Theos and SDK
        run: |
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          export THEOS="$RUNNER_TEMP/theos"
          arch="$(uname -m)"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${arch}.tar.xz" \
            | tar -xJ -C "$THEOS/toolchain"
          "$THEOS/bin/install-sdk" iPhoneOS16.5

      - name: Build package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: make clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: PowerButtonHooks-roothide
          path: packages/*.deb
          if-no-files-found: error
